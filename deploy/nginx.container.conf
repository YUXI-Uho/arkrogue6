# 容器内的站点配置（root 指向镜像里的 /usr/share/nginx/html）
# 与 deploy/nginx.conf.snippet 同规则：入口不缓存、带版本号的资源长缓存、安全头逐 location 重挂。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # is6db.js 1547 KB → gzip 后约 227 KB，不开就是白等
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;

    # 安全头：add_header 是覆盖式继承，每个 location 都要重新 include
    include /etc/nginx/security-headers.conf;

    # 入口（/ 与 *.html）不缓存
    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Service Worker / manifest 不能长缓存，否则更新要等一天
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # 带 ?v= 版本号的静态资源长缓存
    location ~* \.(?:js|css|svg)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        internal;
    }
}
