# 裸机（非容器）Nginx 站点配置：/etc/nginx/conf.d/is6.conf
# 用法：
#   cp /var/www/is6/deploy/nginx.server.conf /etc/nginx/conf.d/is6.conf
#   cp /var/www/is6/deploy/security-headers.conf /etc/nginx/security-headers.conf
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;
    root /var/www/is6;
    index index.html;
    charset utf-8;
    client_max_body_size 128k;

    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;

    # add_header 覆盖式继承：每个 location 都要重新 include 安全头
    include /etc/nginx/security-headers.conf;

    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files /index.html =404;
    }

    location ~* \.html$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location = /manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location ~* \.(?:js|css|svg)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 后端 API（Node 只监听 127.0.0.1:3000）
    # 前缀匹配优先于 location /，/api/ 不会落到静态文件
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:3000/healthz;
        access_log off;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    # 隐藏文件 / 内部产物一律拒绝：上传时若混进 .git、raw/、tools/，
    # 这里兜底，避免它们被公网直接下载（raw/ 下单个 JSON 就有 15MB）。
    location ~ /\. {
        deny all;
        access_log off;
    }
    location ~ ^/(raw|tools|tests|review)/ {
        deny all;
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        internal;
    }
}
